name: Check Hearts2Hearts YouTube catalog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: h2h-youtube-catalog-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Read official videos and Shorts
        id: sync
        continue-on-error: true
        run: python scripts/sync_h2h_catalog.py
      - name: Open or update catalog PR
        if: always()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'data: refresh H2H YouTube catalog'
          title: 'data: refresh H2H YouTube catalog'
          body: |
            Automated refresh from the official Hearts2Hearts channel.
            - Preserves existing archive records.
            - Regenerates the rolling 31-day catalog from the archive.
            - Includes sync status metadata.
            - This PR is not auto-merged; main remains unchanged until reviewed.
          branch: automation/h2h-youtube-catalog
          delete-branch: true
          add-paths: |
            data/h2h-archive.json
            data/h2h-monthly.json
            data/h2h-sync-status.json
