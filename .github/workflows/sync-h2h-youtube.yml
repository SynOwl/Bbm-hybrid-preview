name: Check Hearts2Hearts YouTube catalog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2h-youtube-catalog-sync
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Check official YouTube videos and Shorts
        id: sync
        continue-on-error: true
        run: python scripts/sync_h2h_catalog.py
      - name: Commit only catalog data files to main
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/h2h-archive.json data/h2h-monthly.json data/h2h-sync-status.json
          if git diff --cached --quiet; then
            echo 'No catalog or status transition to publish.'
            exit 0
          fi
          git commit -m 'data: sync official H2H YouTube catalog'
          git push origin HEAD:main
      - name: Mark run failed if YouTube collection failed
        if: steps.sync.outcome == 'failure'
        run: exit 1
